# Local reverse proxy: one origin for the app and its WebSockets, so no CORS and no extra ports.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name pixelforge.localhost;

    client_max_body_size 20m;

    # Docker's DNS, re-asked every 10s: containers get a new IP when recreated, and nginx would
    # otherwise keep the address it resolved at startup (502 after any rebuild or restart)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:8080;
    set $reverb_upstream http://reverb:8080;

    # Reverb: WebSocket connections (/app/{key}) and its HTTP API (/apps/...)
    location ~ ^/apps?/ {
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Everything else: PHP-FPM + NGINX in the app container
    location / {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
