# Local development: http://pixelforge.localhost
#
#   composer install && npm install    # dependencies live on the host and are mounted in
#   export UID GID=$(id -g)            # so files the containers write stay yours
#   docker compose up -d --build
#
# Code is mounted, so changes show up without rebuilding. Your .env is still used;
# the variables below only point Laravel at the services in this file.

x-laravel-environment: &laravel-environment
    APP_URL: http://pixelforge.localhost
    DB_CONNECTION: pgsql
    DB_HOST: pgsql
    DB_PORT: 5432
    DB_DATABASE: pixelforge
    DB_USERNAME: pixelforge
    DB_PASSWORD: secret
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    BROADCAST_CONNECTION: reverb
    # Laravel publishes broadcasts straight to the Reverb container; browsers go through the proxy (VITE_REVERB_* below)
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080

x-php: &php
    image: pixelforge:dev
    build:
        context: .
        target: development
        args:
            USER_ID: ${UID:-1000}
            GROUP_ID: ${GID:-1000}
    volumes:
        - .:/var/www/html
    environment:
        <<: *laravel-environment
    depends_on:
        pgsql:
            condition: service_healthy
        redis:
            condition: service_healthy
    restart: unless-stopped

services:
    proxy:
        image: nginx:1.28-alpine
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            # The folder, not the file: a single-file mount keeps the old version after an editor saves a new one
            - ./docker/nginx:/etc/nginx/conf.d:ro
        depends_on:
            - app
            - reverb
        restart: unless-stopped

    app:
        <<: *php
        environment:
            <<: *laravel-environment
            HEALTHCHECK_PATH: /up
            TRUSTED_PROXY: local
            # Link storage and migrate on start, but never cache config/routes while developing
            AUTORUN_ENABLED: 'true'
            AUTORUN_LARAVEL_OPTIMIZE: 'false'
            AUTORUN_LARAVEL_CONFIG_CACHE: 'false'
            AUTORUN_LARAVEL_ROUTE_CACHE: 'false'
            AUTORUN_LARAVEL_VIEW_CACHE: 'false'
            AUTORUN_LARAVEL_EVENT_CACHE: 'false'

    vite:
        <<: *php
        command: ['npm', 'run', 'dev']
        # The image's default check is for its web server, which doesn't run here
        healthcheck:
            disable: true
        ports:
            - '${VITE_PORT:-5173}:5173'
        environment:
            <<: *laravel-environment
            # laravel-vite-plugin then listens on 0.0.0.0:5173 and tells the browser to use localhost:5173
            LARAVEL_SAIL: '1'
            VITE_REVERB_HOST: pixelforge.localhost
            VITE_REVERB_PORT: ${APP_PORT:-80}
            VITE_REVERB_SCHEME: http

    queue:
        <<: *php
        # queue:listen reloads your code for every job; production runs queue:work
        command:
            [
                'php',
                'artisan',
                'queue:listen',
                '--queue=generations,default',
                '--tries=1',
                '--timeout=0',
            ]
        stop_signal: SIGTERM
        # healthcheck-queue looks for queue:work, which queue:listen only starts between jobs
        healthcheck:
            disable: true

    scheduler:
        <<: *php
        command: ['php', 'artisan', 'schedule:work']
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-schedule']
            start_period: 10s

    reverb:
        <<: *php
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-reverb']
            start_period: 10s

    pgsql:
        image: postgres:17-alpine
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: pixelforge
            POSTGRES_USER: pixelforge
            POSTGRES_PASSWORD: secret
        volumes:
            - pgsql:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', 'pixelforge', '-d', 'pixelforge']
            interval: 5s
            retries: 10
        restart: unless-stopped

    redis:
        image: redis:7.4-alpine
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            retries: 10
        restart: unless-stopped

volumes:
    pgsql:
    redis:
